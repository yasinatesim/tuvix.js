<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tuvix.js — with-react-sandbox</title>
    <style>
      body {
        margin: 0;
        background: #0f0f1a;
        color: #e0e0e0;
        font-family: system-ui, sans-serif;
      }
      .global-card {
        padding: 24px;
        background: #16213e;
        border-radius: 12px;
        margin-bottom: 24px;
      }
      /* Matches every paragraph in the light DOM, none inside app1's shadow root. */
      p {
        color: #93c5fd;
      }
    </style>
  </head>
  <body>
    <div style="max-width: 900px; margin: 40px auto; padding: 0 24px">
      <h1 style="margin-bottom: 24px">Tuvix.js Sandbox Example</h1>

      <div class="global-card">
        <h2>Shell</h2>
        <p data-testid="shell-paragraph">
          The page CSS colors this paragraph light blue.
        </p>
        <p class="shell-note" data-testid="shell-note">
          App 2 has no sandbox, so its CSS colors this note orange.
        </p>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px">
        <div id="app1"></div>
        <div id="app2"></div>
      </div>
    </div>

    <script type="module" src="/src/shell.ts"></script>
  </body>
</html>
